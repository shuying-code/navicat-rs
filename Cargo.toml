[package]
name = "navicat-rs"
version = "0.1.0"
edition = "2021"
description = "Navicat-style multi-engine database manager (Rust/egui), all features unlocked, no license gating, cross-platform"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shuying-code/navicat-rs"
homepage = "https://github.com/shuying-code/navicat-rs"
keywords = ["database", "sqlite", "postgresql", "egui", "gui"]
categories = ["database", "gui"]

[[bin]]
name = "navicat-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["image"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
csv = "1"
anyhow = "1"
postgres = { version = "0.19", default-features = false }

[profile.release]
opt-level = 2
lto = false

