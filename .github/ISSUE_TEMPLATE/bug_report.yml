name: 🐞 Bug / 问题反馈
description: 报告可复现的 Bug 或异常（请尽量填写完整，便于快速定位与修复）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填完整——**可复现的最小步骤与样例**能大幅加快定位和修复。

        > 维护者通常**每周集中处理 / 回复一次** issue（约每周更新）。请勿重复提交同一问题。
        > 提交前请先阅读 [使用反馈指南](https://github.com/shuying-code/navicat-rs/blob/main/docs/FEEDBACK.md)。

  - type: input
    id: version
    attributes:
      label: 版本 / 构建号
      description: 见 Release 页面的文件与 commit（例如 v0.1.0 · 74d4d67）
      placeholder: "v0.1.0 (commit 74d4d67)"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 运行方式
      options:
        - 桌面 GUI（Release 可执行文件）
        - 容器镜像（GHCR）
        - 从源码构建
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统与架构
      placeholder: "Windows 11 x64 / macOS 14 arm64 / Ubuntu 22.04 x64"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: 数据库引擎
      options:
        - SQLite（内置示例库）
        - PostgreSQL
        - 其他（离线演示库）
        - 不涉及
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写清楚，别人照做也能重现问题
      placeholder: |
        1. 打开 ... 页面
        2. 选择 ... 表 / 输入 SQL ...
        3. 点击 ...
        4. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？可附截图 / 录屏链接
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 终端或控制台完整输出；界面报错文本（可脱敏）
      render: shell

  - type: textarea
    id: repro_asset
    attributes:
      label: 最小复现样例（强烈建议）
      description: 相关 SQL、表结构（DDL）、连接类型；能共享的最小数据
      placeholder: |
        -- SQL
        SELECT * FROM t WHERE ...


        -- 表结构
        CREATE TABLE t (id INTEGER PRIMARY KEY, ...);

  - type: input
    id: frequency
    attributes:
      label: 出现频率
      placeholder: "必现 / 偶现（约几次出现一次）"

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 主题、缩放比例、窗口大小、是否可公开数据等

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 issue，未发现重复问题
          required: true
        - label: 我已移除 token / 密码 / 隐私等敏感信息
          required: true
