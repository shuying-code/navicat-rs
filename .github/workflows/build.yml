name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/navicat-rs.exe dist/navicat-rs-windows-x64.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/navicat-rs-windows-x64.exe, dist/README.md -DestinationPath dist/navicat-rs-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: navicat-rs-windows-x64
          path: dist/navicat-rs-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/navicat-rs-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/navicat-rs-macos-universal \
            target/aarch64-apple-darwin/release/navicat-rs \
            target/x86_64-apple-darwin/release/navicat-rs
          chmod +x dist/navicat-rs-macos-universal
          codesign --force --sign - dist/navicat-rs-macos-universal || true
          lipo -info dist/navicat-rs-macos-universal
      - name: Package
        run: |
          cd dist
          tar -czf navicat-rs-macos-universal.tar.gz navicat-rs-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: navicat-rs-macos-universal
          path: dist/navicat-rs-macos-universal.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/navicat-rs-macos-universal.tar.gz

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/navicat-rs dist/navicat-rs-linux-x64
          chmod +x dist/navicat-rs-linux-x64
          tar -czf dist/navicat-rs-linux-x64.tar.gz -C dist navicat-rs-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: navicat-rs-linux-x64
          path: dist/navicat-rs-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/navicat-rs-linux-x64.tar.gz
